# Sentinel SOC Local Endpoint Sensor Configuration
# Supports both Windows and Linux endpoints

server:
  url: "http://localhost:8000"  # In production, use https://soc.yourdomain.com
  verify_ssl: true
  timeout_seconds: 60

auth:
  # Provide enrollment_token for initial setup, or api_key once enrolled
  enrollment_token: ""  # e.g., "stk_abc123..."
  sensor_id: ""
  api_key: ""           # Saved automatically after successful enrollment

collection:
  heartbeat_interval_seconds: 30
  telemetry_interval_seconds: 60
  enable_device_discovery: true
  enable_security_logs: true
  enable_connection_monitoring: true
  max_connections_sample: 50

buffer:
  db_path: "sentinel_sensor_buffer.db"
  max_buffered_events: 10000
  batch_size: 50

logging:
  level: "INFO"
  file_path: "sentinel_sensor.log"
  max_bytes: 5242880  # 5 MB rotating log
  backup_count: 3
