<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="70%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Metallic Silver Ring Gradient -->
    <linearGradient id="metallicSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9" />
      <stop offset="25%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="75%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Electric Cyan Glowing Gradient -->
    <radialGradient id="cyanCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#22d3ee" />
      <stop offset="60%" stop-color="#06b6d4" />
      <stop offset="90%" stop-color="#083344" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" />

  <!-- Outer Cyber Eye Aperture / Shield Ring -->
  <circle cx="256" cy="256" r="216" fill="none" stroke="url(#metallicSilver)" stroke-width="12" stroke-opacity="0.85" />
  <circle cx="256" cy="256" r="198" fill="none" stroke="#06b6d4" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="12 6" />

  <!-- Targeting HUD Arc Crosshairs -->
  <path d="M 256 36 L 256 68 M 256 444 L 256 476 M 36 256 L 68 256 M 444 256 L 476 256" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" filter="url(#cyanGlow)" />

  <!-- Metallic Aperture Blades / Iris Shutter -->
  <g transform="translate(256, 256)">
    <!-- Rotating Cyber Blades -->
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" fill="url(#metallicSilver)" opacity="0.9" />
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" transform="rotate(60)" fill="url(#metallicSilver)" opacity="0.85" />
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" transform="rotate(120)" fill="url(#metallicSilver)" opacity="0.9" />
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" transform="rotate(180)" fill="url(#metallicSilver)" opacity="0.85" />
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" transform="rotate(240)" fill="url(#metallicSilver)" opacity="0.9" />
    <path d="M 0,-180 L 45,-120 L 20,-60 L -40,-110 Z" transform="rotate(300)" fill="url(#metallicSilver)" opacity="0.85" />
  </g>

  <!-- Mid Iris Ring -->
  <circle cx="256" cy="256" r="128" fill="#080e1a" stroke="url(#metallicSilver)" stroke-width="6" />
  <circle cx="256" cy="256" r="114" fill="none" stroke="#00f0ff" stroke-width="3" filter="url(#cyanGlow)" stroke-dasharray="8 4" />

  <!-- Inner Cyber Core / Iris Optical Glow -->
  <circle cx="256" cy="256" r="92" fill="url(#cyanCore)" />

  <!-- Inner Core Pupil & Crosshair Focal Point -->
  <circle cx="256" cy="256" r="42" fill="#020408" stroke="#00f0ff" stroke-width="3" filter="url(#cyanGlow)" />
  <circle cx="256" cy="256" r="18" fill="#ffffff" filter="url(#intenseGlow)" />

  <!-- Concentric Reticle Radar Rings -->
  <circle cx="256" cy="256" r="68" fill="none" stroke="#a5f3fc" stroke-width="1.5" stroke-opacity="0.8" stroke-dasharray="4 8" />

  <!-- Hexagonal Tech Sensor Accents -->
  <polygon points="256,196 308,226 308,286 256,316 204,286 204,226" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-opacity="0.4" />
</svg>
